<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
    <title>試合結果 | Classmatch MAGNET</title>
    <meta name="author" content="urni - magnet">
    <link rel="canonical" href="https://classmatch.kagomag.net">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/src/img/icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/src/img/icon.png">
  <link rel="stylesheet" href="style.css">
  <meta name="robots" content="noindex, nofollow">
</head>

<body class="site-page system-page system-result-page">
  <div class="classmatch-background" aria-hidden="true">
    <picture>
      <source media="(prefers-reduced-motion: reduce)" srcset="/src/img/classmatch-background-static.svg">
      <img src="/src/img/classmatch-background.svg" alt="">
    </picture>
  </div>

  <header class="result-header filter">
    <h1 id="result-title">試合結果</h1>
    <select class="filter radius" id="sport-select"></select>
  </header>

  <aside class="manual-qr-wrap filter" id="manual-qr-wrap">
      <p>手元で確認</p>
      <canvas id="manual-qr" width="132" height="132"></canvas>
  </aside>

  <main id="leagues-container" class="result-board">読み込み中</main>

  <aside class="result-announcements filter" aria-label="生徒向け連絡">
    <h2>連絡</h2>
    <div id="result-announcements-list" class="result-announcements-list">読み込み中...</div>
  </aside>

  <button class="button filter" id="reporting">結果の誤りを報告</button>
  <div class="reporting-wrap filter">
    <textarea class="reporting-input radius filter" id="reporting-input" placeholder="試合結果の誤りを教えてください" rows="2"></textarea>
    <button class="repoting-button radius filter" id="repoting-button">報告</button>
  </div>

  <div class="commu-popup radius filter">
        <div class="popup-title"></div>
        <div class="popup-content"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
