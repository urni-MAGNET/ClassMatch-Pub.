<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | Classmatch MAGNET</title>
    <meta name="author" content="urni - magnet">
    <link rel="canonical" href="https://classmatch.kagomag.net">
    <link rel="apple-touch-icon" sizes="180x180" href="/src/img/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/src/img/icon.png">
    <link rel="stylesheet" href="./style.css">
    <meta name="google-site-verification" content="e1UuobzFF9_BlNGXJIVBrNezcE0ZH_AdN_AjTZc3_c8" />
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
</head>
<body class="site-page login-page">
        <div class="classmatch-background" aria-hidden="true">
            <picture>
                <source media="(prefers-reduced-motion: reduce)" srcset="/src/img/classmatch-background-static.svg">
                <img src="/src/img/classmatch-background.svg" alt="">
            </picture>
        </div>

    <header class="header site-header login-header">
        <a href="/" class="site-logo">ClassMatch</a>
        <nav class="site-nav" aria-label="ページメニュー">
            <a href="/">トップ</a>
        </nav>
    </header>

    <main class="site-main login-main">
        <section class="site-section login-layout">
            <div class="login-copy">
                <p class="site-label">Login</p>
                <h1>学校アカウントでログイン</h1>
                <p>
                    登録済みのメールアドレスとパスワードを入力して、管理ページへ進みます。
                </p>
            </div>

            <section class="input-box form-panel" aria-label="ログインフォーム">
                <p class="label form-title">ログイン</p>
                <input type="email" name="" id="email" class="login-input form-input filter" placeholder="メールアドレスを入力">
                <input type="password" name="" id="password" class="login-input form-input filter" placeholder="パスワードを入力">
                <input type="submit" value="送信" id="submit-btn" class="form-submit filterhover">
                <div class="loginwithgoogle-btn">
                <button class="gsi-material-button" id="signinWithGoogle">
                    <div class="gsi-material-button-state"></div>
                    <div class="gsi-material-button-content-wrapper">
                    <div class="gsi-material-button-icon">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                            <path fill="none" d="M0 0h48v48H0z"></path>
                        </svg>
                    </div>
                    <span class="gsi-material-button-contents">Googleでサインイン</span>
                    <span style="display: none;">Googleでサインイン/span>
                    </div>
                </button>
            </div>
                <a href="/" class="form-link">学校アカウントを作成する</a>
            </section>
        </section>
    </main>
    <script type="module">
        import "/src/js/school/login.js";
        import "/src/js/animation.js";
    </script>
</body>
</html>
