<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードをリセット | Classmatch MAGNET</title>
    <meta name="author" content="urni - magnet">
    <link rel="canonical" href="https://classmatch.kagomag.net">
    <link rel="apple-touch-icon" sizes="180x180" href="/src/img/icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/src/img/icon.png">
    <link rel="stylesheet" href="/mypage/style.css">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
</head>

<body class="site-page mypage-page mypage-detail-page">
   <header class="header site-header login-header">
        <a href="/" class="site-logo">ClassMatch</a>
        <nav class="site-nav" aria-label="ページメニュー">
            <a href="/">トップ</a>
        </nav>
    </header>


    <div class="classmatch-background" aria-hidden="true">
        <picture>
            <source media="(prefers-reduced-motion: reduce)" srcset="/src/img/classmatch-background-static.svg">
            <img src="/src/img/classmatch-background.svg" alt="">
        </picture>
    </div>

    <main class="box filter detail-box account-page-box">
        <h1 class="title">パスワードをリセット</h1>
        
        <section class="account-panel filter">
            <h2>登録内容の編集</h2>
            <label>新しいパスワード
                <input id="password-input" class="filter" maxlength="80" type="password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{8,}" autocomplete="new-password" aria-describedby="password-policy-help"><p id="password-policy-help">半角英字と数字を両方含む8文字以上の英数字</p>
            </label>
            <label>新しいパスワード(確認用)
                <input id="password-input-re" class="filter" maxlength="80" type="password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{8,}" autocomplete="new-password" aria-describedby="password-policy-help">
            </label>
            <button id="password-reset-submit-btn" class="filter filterhover" type="button">更新</button>
        </section>

    </main>

    <div class="commu-popup radius filter">
      <div class="popup-title"></div>
      <div class="popup-content"></div>
    </div>

    <script type="module">
        import "/src/js/school/mypage/reset.js";
    </script>
</body>

</html>
