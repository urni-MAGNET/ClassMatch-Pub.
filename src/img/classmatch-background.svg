<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset=".52" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#3b82f6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow">
      <stop stop-color="#ef4444" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <circle cx="1360" cy="160" r="390" fill="url(#blueGlow)">
    <animate attributeName="cx" values="1360;1290;1360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="760" r="430" fill="url(#redGlow)">
