      <animate attributeName="stroke-dashoffset" values="0;-128" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity=".16" fill="none" stroke="#475569" stroke-width="3">
    <rect x="1035" y="80" width="430" height="260" rx="18"/>
    <path d="M1250 80v260M1035 210h430"/>
    <circle cx="1250" cy="210" r="58"/>
    <path d="M1035 150h68v120h-68M1465 150h-68v120h68"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-16 10;0 0" dur="16s" repeatCount="indefinite"/>
  </g>

  <g opacity=".13" fill="none" stroke="#475569" stroke-width="3">
    <circle cx="285" cy="235" r="132"/>
    <path d="M153 235h264M285 103v264M178 157c70 40 144 40 214 0M178 313c70-40 144-40 214 0"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;18 -10;0 0" dur="19s" repeatCount="indefinite"/>
  </g>

  <g opacity=".25">
    <g fill="#2563eb">
      <rect x="130" y="110" width="8" height="22" rx="3" transform="rotate(-24 134 121)"/>
      <rect x="850" y="125" width="7" height="18" rx="3" transform="rotate(32 854 134)"/>
      <circle cx="1490" cy="570" r="5"/>
    </g>
    <g fill="#dc2626">
      <rect x="520" y="92" width="8" height="20" rx="3" transform="rotate(42 524 102)"/>
      <circle cx="1120" cy="755" r="5"/>
      <rect x="330" y="705" width="7" height="18" rx="3" transform="rotate(-38 334 714)"/>
    </g>
    <g fill="#f59e0b">
      <circle cx="720" cy="770" r="5"/>
      <rect x="1430" y="300" width="8" height="20" rx="3" transform="rotate(24 1434 310)"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 -12;0 16;0 -12" dur="11s" repeatCount="indefinite"/>
  </g>

  <g opacity=".18" filter="url(#soft)">
